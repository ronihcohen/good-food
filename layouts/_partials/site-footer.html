<footer class="wsp-footer" role="contentinfo">
  <div class="wsp-footer-inner">
    <div>
      <div class="wsp-footer-brand-name">{{ .Site.Title }}</div>
      <div class="wsp-footer-brand-desc">{{ .Site.Params.description }}</div>
    </div>
    {{ if .Site.Menus.main }}
    <div>
      <div class="wsp-footer-nav-title">ניווט</div>
      <ul class="wsp-footer-nav-list">
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </div>
    {{ end }}
  </div>
  <div class="wsp-footer-bottom">
    המידע באתר זה מסופק למטרות מידע כללי בלבד. לקבלת ייעוץ רפואי או אבחון, יש לפנות לאיש מקצוע.<br>
    © {{ now.Year }} {{ .Site.Title }}
  </div>
</footer>
