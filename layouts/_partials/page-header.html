{{ $featured_image := partials.Include "func/GetFeaturedImage.html" . }}
{{ if $featured_image }}
<header class="wsp-hero" style="background-image: url('{{ $featured_image }}');">
  <div class="wsp-hero-content">
    {{ if not .Params.omit_header_text }}
      <h1 class="wsp-hero-title">{{ .Title | compare.Default .Site.Title }}</h1>
      {{ with .Params.description }}
        <p class="wsp-hero-desc">{{ . }}</p>
      {{ end }}
      {{ if .IsHome }}
        <a href="{{ "/food/" | relURL }}" class="wsp-hero-cta">גלה מאכלים</a>
      {{ end }}
    {{ end }}
  </div>
</header>
{{ end }}
