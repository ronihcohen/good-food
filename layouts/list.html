{{ define "main" }}
<div class="wsp-container">
  {{ with .Content }}
  <div class="nested-copy-line-height lh-copy mid-gray" style="max-width:680px;margin:0 auto 2rem;text-align:center;">{{ . }}</div>
  {{ end }}
  <div class="wsp-grid">
    {{ range .Paginator.Pages }}
      {{ .Render "summary" }}
    {{ end }}
  </div>
  {{ partial "pagination.html" . }}
</div>
{{ end }}
